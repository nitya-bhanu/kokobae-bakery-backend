spring.data.mongodb.uri=${MONGO_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# 24 hours in milliseconds

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGIN}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Delivery Configuration
# We deliver across all of Hyderabad - any valid 6-digit pincode is accepted
delivery.allowed.pincode.pattern=^[1-9][0-9]{5}$

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_EMAIL}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

bakery.email.from=kokobae.bakery@gmail.com
bakery.email.fromName=Kokobae Bakery

# Rate Limiting Configuration
rate-limiting.auth.max-requests=5
rate-limiting.auth.window-seconds=60
